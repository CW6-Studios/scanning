<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MathSnap — Camera</title>
  <meta name="description" content="MathSnap camera mode. Point at a math problem and press your Xbox controller to capture." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #080c18;
      --surface: #0f1424;
      --card:    #161d32;
      --border:  #1e2a45;
      --primary: #7c3aed;
      --primary2:#a855f7;
      --cyan:    #00d4ff;
      --green:   #10b981;
      --red:     #ef4444;
      --text:    #f0f4ff;
      --muted:   #8892aa;
      --font:    'Inter', sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: #000;
      color: var(--text);
      overflow: hidden;
    }

    /* ── VIDEO LAYER ─────────────────────────────── */
    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* ── FLASH OVERLAY ───────────────────────────── */
    #flash {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity .08s ease;
    }

    #flash.active { opacity: .85; }

    /* ── FROZEN FRAME OVERLAY ────────────────────── */
    #frozen-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #frozen-img {
      max-width: 90%;
      max-height: 75vh;
      border-radius: 12px;
      box-shadow: 0 0 0 3px var(--cyan), 0 30px 80px rgba(0,0,0,.8);
    }

    #frozen-label {
      margin-top: 16px;
      font-size: .85rem;
      font-weight: 600;
      color: var(--cyan);
      letter-spacing: .08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sending-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      animation: blink 1s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; } 50% { opacity: 0; }
    }

    /* ── SETUP PANEL (before connection) ─────────── */
    #setup-panel {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background: rgba(8,12,24,.92);
      backdrop-filter: blur(20px);
    }

    .setup-logo {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .setup-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -.02em;
    }

    .setup-subtitle {
      font-size: .88rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .input-group {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-label {
      font-size: .78rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .room-input {
      width: 100%;
      padding: 16px 18px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: var(--font);
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      transition: border-color .2s;
    }

    .room-input:focus { border-color: var(--primary2); }
    .room-input::placeholder { color: var(--border); letter-spacing: .04em; }

    .connect-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary2) 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, opacity .15s;
      box-shadow: 0 8px 30px rgba(124,58,237,.4);
    }

    .connect-btn:active { transform: scale(.97); }
    .connect-btn:disabled { opacity: .5; cursor: not-allowed; }

    .setup-hint {
      margin-top: 16px;
      font-size: .78rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    /* ── TOP STATUS BAR ──────────────────────────── */
    #status-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,.7), transparent);
    }

    .status-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.connecting { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; animation: blink 1s infinite; }
    .status-dot.connected  { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-dot.error      { background: var(--red); box-shadow: 0 0 8px var(--red); }

    .status-text {
      font-size: .8rem;
      font-weight: 600;
      color: var(--text);
    }

    .controller-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .72rem;
      font-weight: 600;
      color: var(--muted);
      background: rgba(255,255,255,.07);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.1);
    }

    .controller-badge.active { color: var(--green); border-color: rgba(16,185,129,.3); }

    /* ── BOTTOM CONTROLS ─────────────────────────── */
    #controls {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px 20px 40px;
      background: linear-gradient(to top, rgba(0,0,0,.75), transparent);
    }

    .capture-btn {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      border: 4px solid rgba(255,255,255,.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      transition: transform .1s, box-shadow .1s;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
      position: relative;
    }

    .capture-btn::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.3);
    }

    .capture-btn:active { transform: scale(.92); box-shadow: 0 2px 10px rgba(0,0,0,.5); }

    .controls-hint {
      font-size: .72rem;
      color: rgba(255,255,255,.5);
      text-align: center;
    }

    /* ── CONNECTING STATE ────────────────────────── */
    #connecting-overlay {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(8,12,24,.85);
      backdrop-filter: blur(20px);
    }

    .spinner {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--primary2);
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .connecting-text {
      font-size: 1rem;
      font-weight: 600;
      color: var(--muted);
    }

    /* ── ERROR TOAST ─────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 60;
      background: var(--red);
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: .82rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity .3s, transform .3s;
      white-space: nowrap;
    }

    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Live video -->
  <video id="video" autoplay playsinline muted></video>

  <!-- White flash on capture -->
  <div id="flash"></div>

  <!-- Frozen frame preview -->
  <div id="frozen-overlay">
    <img id="frozen-img" src="" alt="Captured frame" />
    <div id="frozen-label">
      <span class="sending-dot"></span>
      <span id="frozen-label-text">Sending to TV…</span>
    </div>
  </div>

  <!-- Setup panel (shown until connected) -->
  <div id="setup-panel">
    <div class="setup-logo">📷</div>
    <div class="setup-title">Camera Mode</div>
    <p class="setup-subtitle">Enter the <strong>Room ID</strong> shown on your TV,<br/>then tap Connect.</p>
    <div class="input-group">
      <label class="input-label" for="room-input">Room ID</label>
      <input id="room-input" class="room-input" type="text" maxlength="8" placeholder="A1B2C3" autocomplete="off" autocorrect="off" spellcheck="false" />
      <button id="connect-btn" class="connect-btn" onclick="startConnect()">Connect to TV</button>
    </div>
    <p class="setup-hint">Or scan the QR code on your TV to auto-fill.</p>
  </div>

  <!-- Connecting overlay -->
  <div id="connecting-overlay">
    <div class="spinner"></div>
    <div class="connecting-text">Connecting to TV…</div>
  </div>

  <!-- Status bar (shown when connected) -->
  <div id="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <div class="status-text" id="status-text">Connecting…</div>
    <div class="controller-badge" id="controller-badge">🎮 No Controller</div>
  </div>

  <!-- Capture controls (shown when connected) -->
  <div id="controls">
    <button class="capture-btn" id="capture-btn" onclick="captureFrame()" title="Capture">📸</button>
    <div class="controls-hint">Press A / B / X / Y on controller — or tap 📸</div>
  </div>

  <!-- Error toast -->
  <div id="toast"></div>

  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <script>
  // ─────────────────────────────────────────────
  //  State
  // ─────────────────────────────────────────────
  let peer = null;
  let conn = null;
  let stream = null;
  let gamepadLoopId = null;
  const prevButtons = {};
  let lastCapture = 0;
  const COOLDOWN = 1500; // ms

  // ─────────────────────────────────────────────
  //  On load: check URL params, start camera
  // ─────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const room = params.get('room');
    if (room) {
      document.getElementById('room-input').value = room.toUpperCase();
    }

    startCamera();

    window.addEventListener('gamepadconnected', onGamepadConnected);
    window.addEventListener('gamepaddisconnected', onGamepadDisconnected);
  });

  // ─────────────────────────────────────────────
  //  Camera
  // ─────────────────────────────────────────────
  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      document.getElementById('video').srcObject = stream;
    } catch (err) {
      showToast('Camera access denied — ' + err.message);
    }
  }

  // ─────────────────────────────────────────────
  //  PeerJS connect
  // ─────────────────────────────────────────────
  function startConnect() {
    const roomId = document.getElementById('room-input').value.trim().toUpperCase();
    if (!roomId) { showToast('Please enter a Room ID'); return; }

    const btn = document.getElementById('connect-btn');
    btn.disabled = true;
    btn.textContent = 'Connecting…';

    showConnecting(true);

    peer = new Peer(); // random peer ID for camera

    peer.on('error', (err) => {
      showConnecting(false);
      showToast('Connection error: ' + err.message);
      btn.disabled = false;
      btn.textContent = 'Connect to TV';
    });

    peer.on('open', () => {
      conn = peer.connect(roomId, { reliable: true, serialization: 'raw' });

      conn.on('open', () => {
        showConnecting(false);
        showLiveUI(true);
        setStatus('connected', '📺 Connected to TV');
        btn.disabled = false;
      });

      conn.on('close', () => {
        setStatus('error', 'Disconnected — reconnect?');
        showToast('Lost connection to TV');
      });

      conn.on('error', (e) => {
        showToast('Peer error: ' + e);
      });
    });

    // Timeout if peer never opens
    setTimeout(() => {
      if (!conn || conn.open === false) {
        peer && peer.destroy();
        showConnecting(false);
        showToast('Could not reach TV. Check the Room ID.');
        btn.disabled = false;
        btn.textContent = 'Connect to TV';
      }
    }, 15000);
  }

  // ─────────────────────────────────────────────
  //  Capture Frame
  // ─────────────────────────────────────────────
  function captureFrame() {
    const now = Date.now();
    if (now - lastCapture < COOLDOWN) return; // debounce
    lastCapture = now;

    if (!conn || !conn.open) { showToast('Not connected to TV'); return; }

    const video = document.getElementById('video');
    if (!video.videoWidth) { showToast('Camera not ready'); return; }

    // Flash
    doFlash();

    // Draw to canvas, resize to max 1280
    const MAX = 1280;
    let w = video.videoWidth, h = video.videoHeight;
    if (w > MAX || h > MAX) {
      if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
      else        { w = Math.round(w * MAX / h); h = MAX; }
    }

    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(video, 0, 0, w, h);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.88);

    // Show freeze-frame preview
    showFrozen(dataUrl, true);

    // Send over data channel
    try {
      conn.send(dataUrl);
      setTimeout(() => showFrozen(null, false), 2500);
    } catch (e) {
      showToast('Send failed: ' + e.message);
      showFrozen(null, false);
    }
  }

  // ─────────────────────────────────────────────
  //  Gamepad
  // ─────────────────────────────────────────────
  function onGamepadConnected(e) {
    updateControllerBadge(true, e.gamepad.id);
    if (!gamepadLoopId) gamepadLoopId = requestAnimationFrame(pollGamepad);
  }

  function onGamepadDisconnected() {
    const gps = navigator.getGamepads();
    const anyLeft = [...gps].some(g => g !== null);
    if (!anyLeft) updateControllerBadge(false);
  }

  function pollGamepad() {
    const gps = navigator.getGamepads();
    for (const gp of gps) {
      if (!gp) continue;
      // A=0, B=1, X=2, Y=3
      for (let i = 0; i <= 3; i++) {
        const key = `${gp.index}-${i}`;
        const pressed = gp.buttons[i]?.pressed ?? false;
        if (pressed && !prevButtons[key]) {
          captureFrame();
        }
        prevButtons[key] = pressed;
      }
    }
    gamepadLoopId = requestAnimationFrame(pollGamepad);
  }

  // ─────────────────────────────────────────────
  //  UI helpers
  // ─────────────────────────────────────────────
  function doFlash() {
    const f = document.getElementById('flash');
    f.classList.add('active');
    setTimeout(() => f.classList.remove('active'), 120);
  }

  function showFrozen(src, visible) {
    const ov = document.getElementById('frozen-overlay');
    if (visible && src) {
      document.getElementById('frozen-img').src = src;
      document.getElementById('frozen-label-text').textContent = 'Sending to TV…';
      ov.style.display = 'flex';
    } else {
      ov.style.display = 'none';
    }
  }

  function showConnecting(visible) {
    document.getElementById('connecting-overlay').style.display = visible ? 'flex' : 'none';
    document.getElementById('setup-panel').style.display = visible ? 'none' : 'flex';
  }

  function showLiveUI(visible) {
    document.getElementById('setup-panel').style.display = 'none';
    document.getElementById('connecting-overlay').style.display = 'none';
    document.getElementById('status-bar').style.display = visible ? 'flex' : 'none';
    document.getElementById('controls').style.display = visible ? 'flex' : 'none';
  }

  function setStatus(state, text) {
    const dot = document.getElementById('status-dot');
    dot.className = 'status-dot ' + state;
    document.getElementById('status-text').textContent = text;
  }

  function updateControllerBadge(connected, id) {
    const badge = document.getElementById('controller-badge');
    if (connected) {
      badge.textContent = '🎮 Controller Ready';
      badge.classList.add('active');
    } else {
      badge.textContent = '🎮 No Controller';
      badge.classList.remove('active');
    }
  }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
  }
  </script>
</body>
</html>
